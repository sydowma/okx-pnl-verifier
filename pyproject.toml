[project]
name = "okx-pnl-verifier"
version = "0.1.0"
description = "Verify monthly PnL calculation and missing-snapshot reconstruction via OKX v5 OpenAPI"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
okx-pnl = "okx_pnl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okx_pnl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
